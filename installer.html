<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Installer | J&amp;J Flooring World</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="icon" type="image/webp" href="assets/jj-mascot.webp">
<meta name="theme-color" content="#FFFFFF">
</head>
<body>
<div class="app">

  <div class="shell">
    <header class="appbar appbar-solo" id="appbar"></header>

    <main class="main inst-main" id="main">

    <section class="view" data-view="today">
      <div class="view-head">
        <h1>Today</h1>
        <div class="sub" id="todayDate"></div>
      </div>
      <div data-mount="today"></div>
    </section>

    <section class="view" data-view="upcoming">
      <div class="view-head">
        <h1>My jobs</h1>
        <div class="sub">Everything assigned to you that is still open.</div>
      </div>
      <div data-mount="upcoming"></div>
    </section>

    <section class="view" data-view="done">
      <div class="view-head">
        <h1>Completed</h1>
        <div class="sub">Closed installs, most recent first.</div>
      </div>
      <div data-mount="done"></div>
    </section>

    </main>
  </div>

  <nav class="bottombar" id="nav" role="tablist" aria-label="Installer navigation">
    <button data-view="today" data-title="Today" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Today <b data-count="today"></b></span>
    </button>
    <button data-view="upcoming" data-title="My jobs" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h11v5H3zM14 9h4l3 4v5h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>
      <span>My Jobs</span>
    </button>
    <button data-view="done" data-title="Completed" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <span>Completed</span>
    </button>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/ghlSync.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/installer.js"></script>
<script>
(function () {
  'use strict';
  if (!Auth.require('Installer')) return;
  var me = Auth.currentUser();

  Auth.mountHeader(document.getElementById('appbar'));
  UI.demoBanner(document.getElementById('main'));

  document.getElementById('todayDate').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  InstallerView.init(me);
  UI.wireTabs('#nav');
})();
</script>
</body>
</html>
